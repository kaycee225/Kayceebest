version: v1.0
name: Download, Zip and Upload Pipeline

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2204

blocks:
  - name: Download, Zip and Upload
    task:
      jobs:
        - name: Run Downloader and Uploader Script
          commands:
            - checkout
            - |
              #!/usr/bin/env bash
              set -e

              echo "📦 Installing dependencies (7-zip, libtorrent, Python3)..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq p7zip-full python3 python3-libtorrent python3-requests python3-pip curl

              # Use system pip to guarantee packages are installed for the exact Python version running the script
              sudo python3 -m pip install --no-cache-dir --break-system-packages natsort requests magnet2torrent

              mkdir -p downloads torrents

              echo "🧲 Processing links and starting libtorrent..."
              /usr/bin/python3 -u - << 'EOF'
              import os
              import time
              import asyncio
              import glob
              import requests
              import libtorrent as lt
              from urllib.parse import urlparse
              from magnet2torrent import Magnet2Torrent

              link_url = "https://pink-script-snap.lovable.app/api/public/page/8d1b2896-6de8-4baa-bd07-3ab013b33ac2.txt"

              try:
                  ks = requests.get(link_url, timeout=10).text
                  if "STOP.ALL.TORRENTS" in ks:
                      print("🛑 Global kill switch active.")
                      exit(0)
              except Exception as e:
                  print(f"Error fetching links: {e}")
                  exit(1)

              async def process_links(ks_text):
                  direct_links = []
                  failed_magnets = []
                  
                  for i, link in enumerate(ks_text.splitlines()):
                      link = link.strip()
                      if not link or link.startswith('#') or link.endswith(' NO'):
                          continue
                          
                      if link.startswith('magnet:'):
                          print(f"📥 Converting magnet: {link[:60]}...", flush=True)
                          try:
                              m2t = Magnet2Torrent(link)
                              filename, torrent_data = await asyncio.wait_for(m2t.retrieve_torrent(), timeout=30)
                              torrent_path = os.path.join("torrents", f"{filename}.torrent")
                              with open(torrent_path, "wb") as f:
                                  f.write(torrent_data)
                              print(f"✅ Saved torrent: {torrent_path}")
                          except Exception as e:
                              print(f"⚠️ Magnet conversion failed ({e}). Queuing raw magnet for libtorrent fallback!", flush=True)
                              failed_magnets.append(link)
                      elif link.startswith('http'):
                          if link.endswith('.torrent'):
                              try:
                                  tor_data = requests.get(link, timeout=15).content
                                  parsed = urlparse(link)
                                  filename = os.path.basename(parsed.path) or f"download_{i}.torrent"
                                  with open(os.path.join('torrents', filename), 'wb') as tf:
                                      tf.write(tor_data)
                                  print(f"✅ Downloaded .torrent file: {filename}")
                              except Exception as e:
                                  print(f"❌ Failed to download torrent file ({e}): {link}")
                          else:
                              direct_links.append(link)
                              
                  return direct_links, failed_magnets

              # Run the asyncio conversion loop first
              direct_links, failed_magnets = asyncio.run(process_links(ks))

              # Initialize libtorrent session with DHT enabled and 10 concurrent downloads
              session_settings = {
                  'listen_interfaces': '0.0.0.0:6881', 
                  'enable_dht': True,
                  'active_downloads': 10,   # Force 10 concurrent downloads
                  'active_limit': 15        # Total active limit (downloads + checking + seeding)
              }
              ses = lt.session(session_settings)
              ses.add_dht_router("router.bittorrent.com", 6881)
              ses.add_dht_router("router.utorrent.com", 6881)
              ses.add_dht_router("dht.transmissionbt.com", 6881)

              handles = []
              completed_list = []

              # 1. Add all .torrent files (downloaded & converted via magnet2torrent)
              for t_file in glob.glob("torrents/*.torrent"):
                  try:
                      info = lt.torrent_info(t_file)
                      h = ses.add_torrent({'ti': info, 'save_path': './downloads'})
                      handles.append(h)
                      print(f"🧲 Added to libtorrent: {t_file}")
                  except Exception as e:
                      print(f"❌ Failed to add {t_file} to libtorrent: {e}")

              # 2. Add raw magnets that failed magnet2torrent conversion as a fallback
              for mag in failed_magnets:
                  try:
                      params = lt.parse_magnet_uri(mag)
                      params.save_path = './downloads'
                      h = ses.add_torrent(params)
                      handles.append(h)
                      print(f"🧲 Added raw magnet fallback to libtorrent.")
                  except Exception as e:
                      print(f"❌ Failed to add fallback magnet: {e}")

              # 3. Fallback for direct HTTP file links
              if direct_links:
                  for dlink in direct_links:
                      print(f"🔗 Direct HTTP download via curl: {dlink}")
                      result = os.system(f"cd downloads && curl -O -J -L '{dlink}'")
                      if result == 0:
                          completed_list.append(f"[Direct Link] {dlink.split('/')[-1]}")

              # Wait for libtorrent downloads
              if handles:
                  print("\n🚀 Waiting for libtorrent downloads to finish...")
                  active = list(handles)
                  while active:
                      for h in active[:]:
                          s = h.status()
                          if h.is_seed() or s.progress == 1.0:
                              name = h.name() or 'Unknown'
                              print(f"✅ Finished: {name}")
                              completed_list.append(f"[Torrent] {name}")
                              active.remove(h)
                          else:
                              if s.has_metadata:
                                  rate = s.download_rate
                                  eta_str = "Calculating..."
                                  if rate > 0:
                                      remaining_bytes = s.total_wanted - s.total_wanted_done
                                      if remaining_bytes < 0: remaining_bytes = 0
                                      eta_sec = int(remaining_bytes / rate)
                                      m, s_sec = divmod(eta_sec, 60)
                                      h_hr, m = divmod(m, 60)
                                      if h_hr > 0:
                                          eta_str = f"{h_hr:02d}:{m:02d}:{s_sec:02d}"
                                      else:
                                          eta_str = f"{m:02d}:{s_sec:02d}"
                                          
                                  print(f"📊 Progress [{h.name()[:30]}]: {s.progress * 100:.2f}% | Peers: {s.num_peers} | Down: {rate / 1000:.1f} kB/s | ETA: {eta_str}", flush=True)
                              else:
                                  print(f"⏳ Downloading metadata for magnet...", flush=True)
                      if active:
                          time.sleep(10)
              
              print("\n🎉 === All Completed Downloads ===")
              if completed_list:
                  for item in completed_list:
                      print(f" - {item}")
              else:
                  print(" - No downloads completed successfully.")
              print("================================\n")
              EOF

              echo "📦 Running Multi-Threaded Smart Auto-Group Zipping & Splitting..."
              /usr/bin/python3 -u - << 'EOF'
              import os, shutil, subprocess, re
              from collections import defaultdict
              from natsort import natsorted

              folder = "downloads"
              video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
              media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
              max_bytes = 10000 * 1024 * 1024

              def get_dir_size(p):
                  return sum(os.path.getsize(os.path.join(dp, f)) for dp, _, fn in os.walk(p) for f in fn)

              def create_7z_group(group_name, file_paths, base_dir, max_bytes_limit):
                  group_dir = os.path.join(base_dir, group_name)
                  os.makedirs(group_dir, exist_ok=True)
                  
                  files_to_move = list(file_paths)
                  for p in file_paths:
                      base_stem = os.path.splitext(p)[0]
                      for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                          sub_file = base_stem + sub_ext
                          if os.path.exists(sub_file) and sub_file not in files_to_move:
                              files_to_move.append(sub_file)

                  for p in files_to_move:
                      dst = os.path.join(group_dir, os.path.basename(p))
                      if p != dst and not os.path.exists(dst):
                          shutil.move(p, dst)
                  
                  folder_size = get_dir_size(group_dir)
                  zip_name = f"{group_name}.zip"
                  orig = os.getcwd()
                  os.chdir(base_dir)
                  cmd = ["7z", "a", "-mx0", "-mmt=on", zip_name, group_name]
                  if folder_size > max_bytes_limit:
                      cmd.insert(2, "-v5900m")
                  subprocess.run(cmd, check=True)
                  os.chdir(orig)
                  shutil.rmtree(group_dir)

              # 1. Zip folders directly if they contain > 3 nested videos
              if os.path.exists(folder):
                  for item in natsorted(os.listdir(folder)):
                      item_path = os.path.join(folder, item)
                      if os.path.isdir(item_path):
                          vids = natsorted([
                              os.path.join(r, f) for r, _, files in os.walk(item_path)
                              for f in files if f.lower().endswith(video_ext)
                          ])
                          if len(vids) > 3:
                              print(f"📦 Zipping folder directly (> 3 videos): {item}")
                              folder_size = get_dir_size(item_path)
                              orig = os.getcwd()
                              os.chdir(folder)
                              zip_name = f"{item}.zip"
                              cmd = ["7z", "a", "-mx0", "-mmt=on", zip_name, item]
                              if folder_size > max_bytes:
                                  cmd.insert(2, "-v5900m")
                              subprocess.run(cmd, check=True)
                              os.chdir(orig)
                              shutil.rmtree(item_path)

              # 2. Gather remaining videos across downloads directory
              all_videos = []
              for r, _, files in os.walk(folder):
                  for f in files:
                      if f.lower().endswith(video_ext):
                          all_videos.append(os.path.join(r, f))

              all_videos = natsorted(all_videos)

              # Detect series episode patterns (e.g. S01E01, S1, 1x01, Season 1)
              series_regex = re.compile(r'(?i)(?:^(.*?)[.\s_-]+)?(?:S(\d{1,2})|\b(\d{1,2})x(\d{1,2})\b)')
              
              series_groups = defaultdict(list)
              movies = []

              for vid_path in all_videos:
                  vid_name = os.path.basename(vid_path)
                  parent_name = os.path.basename(os.path.dirname(vid_path))
                  match = series_regex.search(vid_name) or series_regex.search(parent_name)
                  
                  if match:
                      raw_title = match.group(1) or "Series"
                      s_num = match.group(2) or match.group(3) or "01"
                      group_key = f"{raw_title.strip('. -_').lower()}_S{s_num}"
                      series_groups[group_key].append(vid_path)
                  else:
                      # Non-series files are classified as movies
                      movies.append(vid_path)

              loose_series_videos = []

              # 3. Process Series Groups
              for group_key in natsorted(series_groups.keys()):
                  vids = natsorted(series_groups[group_key])
                  if len(vids) > 3:
                      # > 3 episodes in same series season -> zip & name after first episode
                      first_stem = os.path.splitext(os.path.basename(vids[0]))[0]
                      print(f"📦 Zipping series group ({group_key}) with {len(vids)} episodes -> {first_stem}.zip")
                      create_7z_group(first_stem, vids, folder, max_bytes)
                  else:
                      # <= 3 episodes -> collect in loose series pool
                      loose_series_videos.extend(vids)

              # 4. Process Loose Series Pool
              loose_series_videos = natsorted(loose_series_videos)
              if len(loose_series_videos) > 3:
                  first_stem = os.path.splitext(os.path.basename(loose_series_videos[0]))[0]
                  print(f"📦 Bundling {len(loose_series_videos)} loose series episodes -> Batch_{first_stem}.zip")
                  create_7z_group(f"Batch_{first_stem}", loose_series_videos, folder, max_bytes)

              # 5. Movies rule: NEVER zip movies (leave loose in downloads)
              if movies:
                  print(f"🎬 Leaving {len(movies)} movies unzipped (never zip movies rule).")

              # Clean up empty folders & pull remaining loose media/subtitles to main downloads folder
              for r, dirs, files in os.walk(folder, topdown=False):
                  if r == folder: continue
                  for f in natsorted(files):
                      if f.lower().endswith(media_ext):
                          src = os.path.join(r, f)
                          dst = os.path.join(folder, f)
                          if not os.path.exists(dst): 
                              shutil.move(src, dst)
                  shutil.rmtree(r, ignore_errors=True)
              EOF

              echo "📤 Running Parallel Multi-Threaded Uploads to Filemirage..."
              /usr/bin/python3 -u - << 'EOF'
              import os
              import subprocess
              import requests
              import time
              import fcntl
              from concurrent.futures import ThreadPoolExecutor
              from natsort import natsorted

              FILEMIRAGE_API_TOKEN = '9QQH-DGES-CWQZ-FXNV'
              FOLDER_PATH = 'downloads'

              try:
                  srv_res = requests.get("https://filemirage.com/api/servers", timeout=10).json()
                  SERVER = srv_res['data']['server']
              except Exception as e:
                  print(f"Failed to fetch Filemirage server: {e}")
                  exit(1)

              def upload_single_file(file_path):
                  filename = os.path.basename(file_path)
                  file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
                  print(f"⬆️ [START] Uploading: {filename} ({file_size_mb:.2f} MB)", flush=True)
                  
                  curl_cmd = [
                      "curl", "-X", "POST",
                      f"{SERVER}/upload.php",
                      "-H", f"Authorization: Bearer {FILEMIRAGE_API_TOKEN}",
                      "-F", f"file=@{file_path}",
                      "--max-time", "3600"
                  ]
                  
                  proc = subprocess.Popen(curl_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  
                  fd = proc.stderr.fileno()
                  fl = fcntl.fcntl(fd, fcntl.F_GETFL)
                  fcntl.fcntl(fd, fcntl.F_SETFL, fl | os.O_NONBLOCK)
                  
                  last_print_time = time.time()
                  buffer = b""
                  
                  while proc.poll() is None:
                      try:
                          chunk = proc.stderr.read(1024)
                          if chunk:
                              buffer += chunk
                              if b'\r' in buffer or b'\n' in buffer:
                                  lines = buffer.replace(b'\r', b'\n').split(b'\n')
                                  buffer = lines[-1]
                                  valid_lines = [L.decode('utf-8', errors='ignore').strip() for L in lines[:-1] if L.strip()]
                                  if valid_lines:
                                      last_line = valid_lines[-1]
                                      if time.time() - last_print_time >= 30:
                                          print(f"📤 Progress [{filename[:25]}]: {last_line}", flush=True)
                                          last_print_time = time.time()
                      except Exception:
                          pass
                      time.sleep(0.5)
                      
                  stdout, stderr = proc.communicate()
                  if proc.returncode == 0:
                      print(f"✅ Finished uploading {filename}: {stdout.decode('utf-8', errors='ignore').strip()}", flush=True)
                  else:
                      err_msg = stderr.decode('utf-8', errors='ignore').strip() if stderr else 'Unknown error'
                      print(f"❌ Curl Error uploading {filename}: {err_msg}", flush=True)

              if os.path.exists(FOLDER_PATH):
                  upload_queue = []
                  for root, dirs, files in os.walk(FOLDER_PATH):
                      for filename in files:
                          if not any(ext in filename for ext in [".!qB", ".part", ".aria2"]):
                              upload_queue.append(os.path.join(root, filename))
                  
                  upload_queue = natsorted(upload_queue)
                  
                  if upload_queue:
                      print(f"🚀 Launching 4 parallel upload workers for {len(upload_queue)} files...", flush=True)
                      with ThreadPoolExecutor(max_workers=4) as executor:
                          executor.map(upload_single_file, upload_queue)
              EOF
