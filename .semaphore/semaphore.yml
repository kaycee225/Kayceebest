              import os
              import subprocess
              import requests
              import time
              import fcntl
              import threading
              from concurrent.futures import ThreadPoolExecutor
              from natsort import natsorted

              VIKINGFILE_API_TOKEN = '8IcySE8jai'
              FOLDER_PATH = 'downloads'
              LINK_URL = "https://utfdtjcnbprlhkhsdovt.supabase.co/functions/v1/download-page/354dcb17-48af-495d-b98f-c9c1bd268c33"

              def check_kill_switch():
                  while True:
                      time.sleep(20)
                      try:
                          res = requests.get(LINK_URL, timeout=5)
                          if res.status_code == 200 and "STOP.ALL.TORRENTS" in res.text:
                              print("🛑 Global kill switch active. Exiting...", flush=True)
                              os._exit(0)
                      except Exception:
                          pass

              threading.Thread(target=check_kill_switch, daemon=True).start()

              def get_vikingfile_upload_urls():
                  candidates = []
                  # Query Vikingfile API v2 file upload node endpoint
                  try:
                      r = requests.get(f"https://vikingfile.com/api/v2/file/upload?key={VIKINGFILE_API_TOKEN}", timeout=10).json()
                      if isinstance(r, dict):
                          url = r.get('data', {}).get('upload_url') or r.get('upload_url') or r.get('result', {}).get('endpoint')
                          if url:
                              candidates.append(url)
                  except Exception:
                      pass

                  # Query Vikingfile API server endpoints
                  for ep in ["https://vikingfile.com/api/upload/server", "https://vikingfile.com/api/servers"]:
                      try:
                          r = requests.get(f"{ep}?key={VIKINGFILE_API_TOKEN}", timeout=10).json()
                          if isinstance(r, dict):
                              srv = r.get('data', {}).get('server') or r.get('server')
                              if srv:
                                  candidates.append(f"{srv.rstrip('/')}/upload.php")
                      except Exception:
                          pass

                  # Direct backend storage node endpoints to bypass Nginx client_max_body_size limits on main frontend domain
                  known_nodes = [
                      "https://s1.vikingfile.com/upload.php",
                      "https://fs1.vikingfile.com/upload.php",
                      "https://upload.vikingfile.com/upload.php",
                      "https://vikingfile.com/api/v2/file/upload",
                      "https://vikingfile.com/api/upload"
                  ]
                  for node in known_nodes:
                      if node not in candidates:
                          candidates.append(node)
                          
                  return candidates

              UPLOAD_URLS = get_vikingfile_upload_urls()

              def upload_single_file(file_path):
                  # Filename and path are used as-is, preserving spaces and special characters without any modification
                  filename = os.path.basename(file_path)
                  file_size_mb = os.path.getsize(file_path) / (1024 * 1024)
                  print(f"⬆️ [START] Uploading to Vikingfile: {filename} ({file_size_mb:.2f} MB)", flush=True)
                  
                  for target_url in UPLOAD_URLS:
                      # Passing array directly into subprocess ensures filenames with spaces, quotes, and special characters pass without shell sanitization or corruption
                      curl_cmd = [
                          "curl", "-X", "POST",
                          target_url,
                          "-H", f"Authorization: Bearer {VIKINGFILE_API_TOKEN}",
                          "-F", f"key={VIKINGFILE_API_TOKEN}",
                          "-F", f"api_key={VIKINGFILE_API_TOKEN}",
                          "-F", f"file=@{file_path}",
                          "--max-time", "3600"
                      ]
                      
                      proc = subprocess.Popen(curl_cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      
                      fd = proc.stderr.fileno()
                      fl = fcntl.fcntl(fd, fcntl.F_GETFL)
                      fcntl.fcntl(fd, fcntl.F_SETFL, fl | os.O_NONBLOCK)
                      
                      last_print_time = time.time()
                      buffer = b""
                      
                      while proc.poll() is None:
                          try:
                              chunk = proc.stderr.read(1024)
                              if chunk:
                                  buffer += chunk
                                  if b'\r' in buffer or b'\n' in buffer:
                                      lines = buffer.replace(b'\r', b'\n').split(b'\n')
                                      buffer = lines[-1]
                                      valid_lines = [L.decode('utf-8', errors='ignore').strip() for L in lines[:-1] if L.strip()]
                                      if valid_lines:
                                          last_line = valid_lines[-1]
                                          if time.time() - last_print_time >= 30:
                                              print(f"📤 Progress [{filename[:25]}]: {last_line}", flush=True)
                                              last_print_time = time.time()
                          except Exception:
                              pass
                          time.sleep(0.5)
                          
                      stdout, stderr = proc.communicate()
                      out_msg = stdout.decode('utf-8', errors='ignore').strip()
                      err_msg = stderr.decode('utf-8', errors='ignore').strip() if stderr else 'Unknown error'
                      
                      # Fact-check response body to ensure HTTP 413 or HTML errors trigger fallback to the next node
                      if proc.returncode == 0 and "413 Request Entity Too Large" not in out_msg and not out_msg.startswith("<html"):
                          print(f"✅ Finished uploading {filename}: {out_msg}", flush=True)
                          return
                      else:
                          print(f"⚠️ Upload node {target_url} returned error for {filename}: {out_msg if out_msg else err_msg}. Trying next endpoint...", flush=True)

                  print(f"❌ Failed to upload {filename} on all Vikingfile endpoints.", flush=True)

              if os.path.exists(FOLDER_PATH):
                  upload_queue = []
                  for root, dirs, files in os.walk(FOLDER_PATH):
                      for filename in files:
                          if not any(ext in filename for ext in [".!qB", ".part", ".aria2"]):
                              upload_queue.append(os.path.join(root, filename))
                  
                  upload_queue = natsorted(upload_queue)
                  
                  if upload_queue:
                      print(f"🚀 Launching 4 parallel upload workers for {len(upload_queue)} files to Vikingfile...", flush=True)
                      with ThreadPoolExecutor(max_workers=4) as executor:
                          executor.map(upload_single_file, upload_queue)
              EOF
