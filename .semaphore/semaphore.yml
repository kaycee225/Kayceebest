            - echo "🚀 Starting max-speed concurrent aria2c downloads..."
            - |
              python3 -u - << 'EOF'
              import os
              import glob
              import asyncio
              import re
              import time
              import requests
              from urllib.parse import urlparse
              from natsort import natsorted
              from magnet2torrent import Magnet2Torrent

              LINK_URL = "https://utfdtjcnbprlhkhsdovt.supabase.co/functions/v1/download-page/354dcb17-48af-495d-b98f-c9c1bd268c33"

              def get_best_trackers():
                  fallback_trackers = [
                      "udp://tracker.openbittorrent.com:80/announce",
                      "udp://tracker.opentrackr.org:1337/announce",
                      "udp://tracker.torrent.eu.org:451/announce",
                      "udp://exodus.desync.com:6969/announce",
                      "udp://open.stealth.si:80/announce",
                      "udp://tracker.tiny-vps.com:6969/announce",
                      "udp://opentracker.i2p.rocks:6969/announce",
                      "udp://tracker.moeking.me:6969/announce",
                      "https://tracker.foreverpirates.co:443/announce",
                      "udp://tracker.cyberia.is:6969/announce"
                  ]
                  try:
                      url = "https://raw.githubusercontent.com/ngosang/trackerslist/master/trackers_best.txt"
                      res = requests.get(url, timeout=5)
                      if res.status_code == 200:
                          fetched = [line.strip() for line in res.text.splitlines() if line.strip()]
                          if fetched:
                              print(f"📡 Successfully loaded {len(fetched)} live trackers.", flush=True)
                              return ",".join(fetched)
                  except Exception as e:
                      print(f"⚠️ Tracker fetch failed ({e}). Using fallback tracker list.", flush=True)
                  return ",".join(fallback_trackers)

              LIVE_TRACKERS = get_best_trackers()

              def parse_size_to_bytes(val_str, unit_str):
                  try:
                      val = float(val_str)
                  except ValueError:
                      return 0.0
                  unit = unit_str.lower()
                  if 'ti' in unit or 't' in unit:
                      return val * (1024**4)
                  elif 'gi' in unit or 'g' in unit:
                      return val * (1024**3)
                  elif 'mi' in unit or 'm' in unit:
                      return val * (1024**2)
                  elif 'ki' in unit or 'k' in unit:
                      return val * 1024
                  return val

              async def download_target(target, sem, finished_set, stuck_timeout=50, max_retries=15):
                  async with sem:
                      basename = os.path.basename(target) if not target.startswith('http') else os.path.basename(urlparse(target).path) or "direct_link"
                      for attempt in range(1, max_retries + 1):
                          print(f"📥 [Attempt {attempt}/{max_retries}] Starting: {basename[:40]}", flush=True)
                          cmd = [
                              "aria2c",
                              "--console-log-level=notice",
                              "--summary-interval=5",
                              "--dir=downloads",
                              "--seed-time=0",
                              "--file-allocation=none",
                              "--enable-dht=true",
                              "--dht-entry-point=dht.transmissionbt.com:6881",
                              "--dht-entry-point=router.utorrent.com:6881",
                              "--disable-ipv6=true",
                              "--enable-peer-exchange=true",
                              "--follow-torrent=mem",
                              "-s16",
                              "-x16",
                              "--min-split-size=1M",
                              "--max-connection-per-server=16",
                              "--bt-max-peers=128",
                              "--bt-tracker-connect-timeout=5",
                              "--bt-tracker-timeout=5",
                              f"--bt-tracker={LIVE_TRACKERS}",
                              target
                          ]
                          
                          proc = await asyncio.create_subprocess_exec(
                              *cmd,
                              stdout=asyncio.subprocess.PIPE,
                              stderr=asyncio.subprocess.STDOUT
                          )
                          
                          download_started = False
                          start_time = time.time()
                          last_print_time = time.time()
                          
                          while proc.returncode is None:
                              try:
                                  line = await asyncio.wait_for(proc.stdout.readline(), timeout=2.0)
                                  if not line:
                                      break
                                  
                                  line_str = line.decode('utf-8', errors='ignore').strip()
                                  line_str = re.sub(r'[\r\x1b\[0-9;]*m', '', line_str)
                                  
                                  if line_str and '[#' in line_str:
                                      match = re.search(r'\[#\w+\s+([0-9\.]+)([KMGTP]?[iB]*)/([0-9\.]+)([KMGTP]?[iB]*)', line_str)
                                      if match:
                                          val_str, unit_str = match.group(1), match.group(2)
                                          downloaded_bytes = parse_size_to_bytes(val_str, unit_str)
                                          
                                          if downloaded_bytes > 0:
                                              if not download_started:
                                                  download_started = True
                                                  print(f"🚀 Active transfer started: {basename[:30]} ({val_str}{unit_str})", flush=True)
                                              start_time = time.time()
                                      
                                      current_time = time.time()
                                      if current_time - last_print_time >= 30 and ('[#' in line_str or 'ETA' in line_str):
                                          print(f"📊 Progress [{basename[:25]}]: {line_str}", flush=True)
                                          last_print_time = current_time
                                  
                                  elapsed = time.time() - start_time
                                  if not download_started and elapsed > stuck_timeout:
                                      print(f"⏱️ Stuck at 0 bytes for {stuck_timeout}s. Retrying attempt {attempt}...", flush=True)
                                      try:
                                          proc.kill()
                                      except Exception:
                                          pass
                                      await proc.wait()
                                      break

                              except asyncio.TimeoutError:
                                  elapsed = time.time() - start_time
                                  if not download_started and elapsed > stuck_timeout:
                                      print(f"⏱️ Idle timeout (0 bytes for {stuck_timeout}s). Retrying attempt {attempt}...", flush=True)
                                      try:
                                          proc.kill()
                                      except Exception:
                                          pass
                                      await proc.wait()
                                      break

                          await proc.wait()
                          
                          if proc.returncode == 0:
                              print(f"✅ Finished: {basename[:40]}", flush=True)
                              finished_set.add(target)
                              return target
                          else:
                              print(f"⚠️ Failed/Timeout on {basename[:40]} (Attempt {attempt}). Cleaning up...", flush=True)
                              try:
                                  if target.startswith('http'):
                                      parsed_url = urlparse(target)
                                      url_filename = os.path.basename(parsed_url.path)
                                      if url_filename:
                                          for f in glob.glob(os.path.join("downloads", f"{url_filename}*")):
                                              os.remove(f)
                                  else:
                                      control_file = os.path.join("downloads", f"{basename}.aria2")
                                      if os.path.exists(control_file):
                                          os.remove(control_file)
                              except Exception as cleanup_err:
                                  print(f"⚠️ Cleanup warning: {cleanup_err}", flush=True)
                      
                      print(f"❌ Failed all attempts for: {basename[:40]}", flush=True)
                      return None

              async def check_links_loop(sem, active_tasks, processed_links, finished_set):
                  while True:
                      await asyncio.sleep(20)
                      try:
                          res = await asyncio.to_thread(requests.get, LINK_URL, timeout=10)
                          if res.status_code == 200:
                              text = res.text
                              if "STOP.ALL.TORRENTS" in text:
                                  print("🛑 Global kill switch active.", flush=True)
                                  os._exit(0)
                              
                              for i, link in enumerate(text.splitlines()):
                                  link = link.strip()
                                  if link and not link.startswith('#') and not link.endswith(' NO'):
                                      if link in processed_links:
                                          continue
                                      processed_links.add(link)
                                      
                                      if link.startswith('magnet:'):
                                          try:
                                              m2t = Magnet2Torrent(link)
                                              filename, torrent_data = await asyncio.wait_for(m2t.retrieve_torrent(), timeout=30)
                                              torrent_path = os.path.join("torrents", f"{filename}.torrent")
                                              with open(torrent_path, "wb") as f:
                                                  f.write(torrent_data)
                                              if torrent_path not in processed_links:
                                                  processed_links.add(torrent_path)
                                                  task = asyncio.create_task(download_target(torrent_path, sem, finished_set))
                                                  active_tasks.add(task)
                                                  task.add_done_callback(active_tasks.discard)
                                          except Exception:
                                              task = asyncio.create_task(download_target(link, sem, finished_set))
                                              active_tasks.add(task)
                                              task.add_done_callback(active_tasks.discard)
                                      elif link.startswith('http'):
                                          if link.endswith('.torrent'):
                                              try:
                                                  tor_data = (await asyncio.to_thread(requests.get, link, timeout=15)).content
                                                  parsed = urlparse(link)
                                                  filename = os.path.basename(parsed.path) or f"dyn_{i}.torrent"
                                                  torrent_path = os.path.join('torrents', filename)
                                                  with open(torrent_path, 'wb') as tf:
                                                      tf.write(tor_data)
                                                  if torrent_path not in processed_links:
                                                      processed_links.add(torrent_path)
                                                      task = asyncio.create_task(download_target(torrent_path, sem, finished_set))
                                                      active_tasks.add(task)
                                                      task.add_done_callback(active_tasks.discard)
                                              except Exception:
                                                  pass
                                          else:
                                              task = asyncio.create_task(download_target(link, sem, finished_set))
                                              active_tasks.add(task)
                                              task.add_done_callback(active_tasks.discard)
                      except Exception:
                          pass

              async def main():
                  targets = natsorted(glob.glob("torrents/*.torrent"))
                  processed_links = set()
                  
                  if os.path.exists("direct_links.txt"):
                      with open("direct_links.txt", "r") as f:
                          links = [line.strip() for line in f if line.strip()]
                          targets.extend(natsorted(links))
                          processed_links.update(links)
                          
                  for t in targets:
                      processed_links.add(t)

                  if not targets:
                      print("⚠️ No torrents or links found to download.")
                      return

                  os.makedirs("downloads", exist_ok=True)
                  sem = asyncio.Semaphore(16)
                  finished_set = set()
                  active_tasks = set()

                  for t in targets:
                      task = asyncio.create_task(download_target(t, sem, finished_set))
                      active_tasks.add(task)
                      task.add_done_callback(active_tasks.discard)

                  bg_monitor = asyncio.create_task(check_links_loop(sem, active_tasks, processed_links, finished_set))

                  while active_tasks:
                      await asyncio.sleep(1)

                  bg_monitor.cancel()

                  print("\n====================")
                  print("🎉 FINISHED DOWNLOADS:")
                  print("====================")
                  for item in natsorted(finished_set):
                      print(f"✅ {item[:80]}")
                  print("====================\n")

              asyncio.run(main())
              EOF

